# SPDX-License-Identifier: Apache-2.0
name: Firmware Build

on:
  push:
    paths: ['firmware/**']
  pull_request:
    paths: ['firmware/**']

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2
    strategy:
      matrix:
        sku: [ROBOT_SKU_BASIC, ROBOT_SKU_STANDARD, ROBOT_SKU_PRO, ROBOT_SKU_INDUSTRIAL]
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (${{ matrix.sku }})
        working-directory: firmware/esp32
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
        env:
          ROBOT_SKU: ${{ matrix.sku }}
