# SPDX-License-Identifier: Apache-2.0
name: Full Validation

on:
  push:
    branches: [main]
  schedule:
    # Saturday at 3:17 UTC
    - cron: '17 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and run firmware tests
        run: |
          sudo apt-get update && sudo apt-get install -y gcc make
          cd firmware/tests
          make clean
          make test

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install and test SDK
        run: |
          cd sdk
          pip install -e ".[dev]"
          pytest --cov=payload_interface --cov=tools tests/
          ruff format --check .
          ruff check .

  web-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Build and test web control
        run: |
          cd sdk/web_control
          npm ci
          npx tsc --noEmit
          npx vitest run
          npx playwright install chromium
          npx playwright test

  cross-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Validate cross-layer types
        run: |
          npm ci
          npx tsx scripts/validate-ros-types.ts
          npx tsx scripts/validate-robot-params.ts

      - name: Validate firmware constraints
        run: |
          python3 scripts/validate-pin-conflicts.py
          python3 scripts/validate-bom-firmware.py
          python3 scripts/validate-kconfig-constraints.py

  ros2-build:
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-numpy
          rosdep update
          rosdep install --from-paths ros2_ws --ignore-src -y --skip-keys="micro_ros_agent"

      - name: Build
        working-directory: ros2_ws
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Test
        working-directory: ros2_ws
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --return-code-on-test-failure \
            --packages-skip robot_bringup robot_simulation

  integration:
    runs-on: ubuntu-latest
    needs: [ros2-build]
    timeout-minutes: 15
    container: ros:humble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-numpy \
            python3-pip \
            ros-humble-nav2-bringup \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-ros-gz-sim \
            ros-humble-ros-gz-bridge \
            xvfb
          pip3 install --upgrade pip
          pip3 install pytest pytest-timeout
          pip3 install "numpy>=1.24,<2"
          pip3 install ./sdk/threewe[sim]
          rosdep update
          rosdep install --from-paths ros2_ws --ignore-src -y --skip-keys="micro_ros_agent"

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          NUMPY_INCLUDE="$(python3 -c 'import numpy; print(numpy.get_include())')"
          cd ros2_ws
          colcon build --symlink-install \
            --cmake-args -DPython3_NumPy_INCLUDE_DIR="$NUMPY_INCLUDE"

      - name: Run integration tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          ros2 launch robot_simulation gazebo.launch.py headless:=true &
          sleep 10
          pytest tests/integration/ -m "simulation and not hardware and not fullstack" --timeout=120 -v --tb=short

  production-build:
    needs: [firmware-tests, python-sdk, web-control, cross-layer, ros2-build]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build production firmware (standard)
        working-directory: firmware/esp32
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory /__w/3we-robot-platform/3we-robot-platform
          mkdir -p managed_components
          trap 'rm -f secure_boot_signing_key.pem' EXIT
          espsecure.py generate_signing_key --version 2 secure_boot_signing_key.pem
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.standard;sdkconfig.defaults.production" \
            set-target esp32s3
          idf.py build

      - name: Verify binary size fits OTA partition
        working-directory: firmware/esp32
        shell: bash
        run: |
          BIN_SIZE=$(wc -c < build/robot_platform_firmware.bin)
          MAX_SIZE=$((2 * 1024 * 1024))  # 2 MB OTA partition limit
          echo "Binary size: $BIN_SIZE bytes (max: $MAX_SIZE)"
          if [ "$BIN_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Binary exceeds OTA partition size!"
            exit 1
          fi
