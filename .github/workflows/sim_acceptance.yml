# SPDX-License-Identifier: Apache-2.0
name: Simulation Acceptance

on:
  pull_request:
    paths:
      - 'ros2_ws/robot_navigation/**'
      - 'ros2_ws/robot_simulation/**'
      - 'ros2_ws/robot_bringup/**'
      - 'firmware/config/**'
  push:
    branches: [main]
    paths:
      - 'ros2_ws/robot_navigation/**'
      - 'ros2_ws/robot_simulation/**'
      - '.github/workflows/sim_acceptance.yml'
  schedule:
    - cron: '23 3 * * 1'  # Weekly Monday regression
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build & Launch Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: osrf/ros:humble-desktop
      options: --ipc=host

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            ros-humble-nav2-bringup \
            ros-humble-nav2-smac-planner \
            ros-humble-slam-toolbox \
            ros-humble-robot-localization \
            ros-humble-xacro \
            ros-humble-ros-gz-bridge \
            ros-humble-ros-gz-sim \
            ros-humble-robot-state-publisher \
            ros-humble-joint-state-publisher \
            ros-humble-tf2-ros \
            bc jq
          pip3 install pytest pytest-timeout

      - name: Build simulation workspace
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --packages-select \
            robot_interfaces \
            robot_description \
            robot_simulation \
            robot_bringup
        shell: bash

      - name: Validate launch files parse correctly
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          # Verify all launch files can be parsed without errors
          python3 -c "
          from launch import LaunchDescription
          from launch.launch_description_sources import PythonLaunchDescriptionSource
          import os, importlib.util

          launch_dir = 'ros2_ws/install/robot_simulation/share/robot_simulation/launch'
          for f in os.listdir(launch_dir):
              if f.endswith('.launch.py'):
                  print(f'Validating {f}...')
                  spec = importlib.util.spec_from_file_location('launch_mod', os.path.join(launch_dir, f))
                  mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(mod)
                  ld = mod.generate_launch_description()
                  assert isinstance(ld, LaunchDescription), f'{f} did not return LaunchDescription'
                  print(f'  OK: {len(ld.entities)} entities')
          print('All launch files valid.')
          "
        shell: bash

      - name: Validate Nav2 params structure
        run: |
          source /opt/ros/humble/setup.bash
          python3 -c "
          import yaml
          with open('ros2_ws/robot_simulation/config/nav2_params_sim.yaml') as f:
              params = yaml.safe_load(f)
          required = ['bt_navigator', 'controller_server', 'planner_server',
                      'local_costmap', 'global_costmap', 'behavior_server']
          for section in required:
              assert section in params, f'Missing section: {section}'
              print(f'  {section}: OK')
          # Verify controller has critics defined
          ctrl = params['controller_server']['ros__parameters']['FollowPath']
          assert 'critics' in ctrl, 'FollowPath missing critics'
          assert 'plugin' in ctrl, 'FollowPath missing plugin'
          print('Nav2 params validation passed.')
          "
        shell: bash

      - name: Run unit tests
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd tests/integration
          # Run test in dry-run mode (import check only, no ROS network)
          python3 -c "
          import test_patrol_acceptance
          print('Test module imports successfully')
          print(f'Waypoints: {len(test_patrol_acceptance.PATROL_WAYPOINTS)}')
          print(f'Trials: {test_patrol_acceptance.NUM_TRIALS}')
          print(f'Min pass rate: {test_patrol_acceptance.MIN_PASS_RATE}')
          "
        shell: bash

  nav2-patrol:
    name: Full Simulation Test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: build-and-lint
    # Only run full sim on schedule or manual trigger (too fragile for PR gate)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    container:
      image: osrf/ros:humble-desktop
      options: --ipc=host

    env:
      MESA_GL_VERSION_OVERRIDE: "3.3"
      LIBGL_ALWAYS_SOFTWARE: "true"
      DISPLAY: ":99"
      IGN_RENDERING_ENGINE: ogre

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            ros-humble-nav2-bringup \
            ros-humble-nav2-smac-planner \
            ros-humble-slam-toolbox \
            ros-humble-robot-localization \
            ros-humble-xacro \
            ros-humble-ros-gz-bridge \
            ros-humble-ros-gz-sim \
            ros-humble-robot-state-publisher \
            ros-humble-joint-state-publisher \
            ros-humble-tf2-ros \
            mesa-utils \
            libgl1-mesa-dri \
            libegl1-mesa \
            libgles2-mesa \
            xvfb \
            bc jq
          pip3 install pytest pytest-timeout

      - name: Start virtual framebuffer
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2

      - name: Build simulation workspace
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --packages-select \
            robot_interfaces \
            robot_description \
            robot_simulation \
            robot_bringup
        shell: bash

      - name: Run 5-point patrol acceptance test
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash

          # Launch simulation in background
          ros2 launch robot_simulation acceptance_test.launch.py \
            headless:=true \
            trials:=10 \
            timeout_per_trial:=120 &
          LAUNCH_PID=$!

          # Wait for Gazebo physics + Nav2 lifecycle to fully initialize
          echo "Waiting 90s for simulation stack to initialize..."
          sleep 90

          # Diagnostics
          echo "=== Topic list ==="
          ros2 topic list 2>/dev/null || true
          echo "=== Check /odom data ==="
          timeout 5 ros2 topic echo /odom --once 2>/dev/null && echo "OK" || echo "NO DATA"
          echo "=== Action servers ==="
          ros2 action list 2>/dev/null || true

          cd tests/integration
          python3 -m pytest test_patrol_acceptance.py -v --timeout=900 \
            --junit-xml=/tmp/patrol_results.xml
          TEST_EXIT=$?
          kill $LAUNCH_PID 2>/dev/null || true
          exit $TEST_EXIT
        shell: bash

      - name: Check pass rate
        if: always()
        run: |
          if [ -f /tmp/sim_results.json ]; then
            PASS_RATE=$(jq '.pass_rate' /tmp/sim_results.json)
            echo "Pass rate: $PASS_RATE"
            if (( $(echo "$PASS_RATE < 0.95" | bc -l) )); then
              echo "FAIL: Nav2 patrol pass rate $PASS_RATE < 95%"
              exit 1
            fi
          else
            echo "WARNING: sim_results.json not generated"
            echo "Simulation infrastructure may not be available in this environment"
            exit 1
          fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            /tmp/sim_results.json
            /tmp/patrol_results.xml
