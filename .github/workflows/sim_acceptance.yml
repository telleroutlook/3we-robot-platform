# SPDX-License-Identifier: Apache-2.0
name: Simulation Acceptance

on:
  pull_request:
    paths:
      - 'ros2_ws/robot_navigation/**'
      - 'ros2_ws/robot_simulation/**'
      - 'ros2_ws/robot_bringup/**'
      - 'firmware/config/**'
  push:
    branches: [main]
    paths:
      - 'ros2_ws/robot_navigation/**'
      - 'ros2_ws/robot_simulation/**'
      - '.github/workflows/sim_acceptance.yml'
  schedule:
    - cron: '23 3 * * 1'  # Weekly Monday regression
  workflow_dispatch:

jobs:
  nav2-patrol:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container:
      image: osrf/ros:humble-desktop
      options: --ipc=host

    env:
      # Software rendering for headless Gazebo
      MESA_GL_VERSION_OVERRIDE: "3.3"
      LIBGL_ALWAYS_SOFTWARE: "true"
      DISPLAY: ":99"
      # Force OGRE 1.x renderer (more compatible with software rendering)
      IGN_RENDERING_ENGINE: ogre

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            ros-humble-nav2-bringup \
            ros-humble-nav2-smac-planner \
            ros-humble-slam-toolbox \
            ros-humble-robot-localization \
            ros-humble-xacro \
            ros-humble-ros-gz-bridge \
            ros-humble-ros-gz-sim \
            ros-humble-robot-state-publisher \
            ros-humble-joint-state-publisher \
            ros-humble-tf2-ros \
            mesa-utils \
            libgl1-mesa-dri \
            libegl1-mesa \
            libgles2-mesa \
            xvfb \
            bc jq
          pip3 install pytest pytest-timeout

      - name: Start virtual framebuffer
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          # Verify GL context works
          glxinfo | grep "OpenGL version" || echo "glxinfo not available (non-fatal)"

      - name: Verify Gazebo can start
        run: |
          source /opt/ros/humble/setup.bash
          # Quick test: start ign gazebo server-only with empty world for 5s
          timeout 10 ign gazebo -s --force-version 6 --iterations 100 || {
            echo "WARNING: Gazebo server failed to start. Checking available rendering engines..."
            dpkg -l | grep -i "ign\|ogre\|rendering" || true
            echo "This may indicate missing rendering libraries for headless mode."
          }
        shell: bash

      - name: Build simulation workspace
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --packages-select \
            robot_interfaces \
            robot_description \
            robot_simulation \
            robot_bringup
        shell: bash

      - name: Run 5-point patrol acceptance test
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash

          # Launch simulation in background
          ros2 launch robot_simulation acceptance_test.launch.py \
            headless:=true \
            trials:=10 \
            timeout_per_trial:=120 &
          LAUNCH_PID=$!

          # Wait for Gazebo physics + Nav2 lifecycle to fully initialize
          echo "Waiting 90s for simulation stack to initialize..."
          sleep 90

          # Verify simulation is running
          echo "Active topics:"
          ros2 topic list 2>/dev/null || true
          echo "Active action servers:"
          ros2 action list 2>/dev/null || true

          cd tests/integration
          python3 -m pytest test_patrol_acceptance.py -v --timeout=900 \
            --junit-xml=/tmp/patrol_results.xml
          TEST_EXIT=$?
          kill $LAUNCH_PID 2>/dev/null || true
          exit $TEST_EXIT
        shell: bash

      - name: Check pass rate
        if: always()
        run: |
          if [ -f /tmp/sim_results.json ]; then
            PASS_RATE=$(jq '.pass_rate' /tmp/sim_results.json)
            echo "Pass rate: $PASS_RATE"
            if (( $(echo "$PASS_RATE < 0.95" | bc -l) )); then
              echo "FAIL: Nav2 patrol pass rate $PASS_RATE < 95%"
              exit 1
            fi
          else
            echo "WARNING: sim_results.json not generated — simulation infrastructure may have failed"
            echo "Check Gazebo logs above for render/physics issues"
            exit 1
          fi
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            /tmp/sim_results.json
            /tmp/patrol_results.xml
