# SPDX-License-Identifier: Apache-2.0
name: Validate ROS Types

on:
  push:
    paths:
      - 'ros2_ws/robot_interfaces/**'
      - 'sdk/web_control/src/types.ts'
      - 'firmware/esp32/main/safety.h'
      - 'scripts/validate-ros-types.ts'
  pull_request:
    paths:
      - 'ros2_ws/robot_interfaces/**'
      - 'sdk/web_control/src/types.ts'
      - 'firmware/esp32/main/safety.h'
      - 'scripts/validate-ros-types.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run validate:ros-types
