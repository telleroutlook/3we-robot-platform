# SPDX-License-Identifier: Apache-2.0
name: Test PyPI Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no upload)'
        type: boolean
        default: true

jobs:
  test-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build threewe SDK
        working-directory: sdk/threewe
        run: python -m build

      - name: Inspect wheel
        working-directory: sdk/threewe
        run: |
          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl | head -60
          echo ""
          echo "=== Sdist contents ==="
          tar tzf dist/*.tar.gz | head -60

      - name: Publish to Test PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@fb13cb306901256ace3dab689990e13a5550ffaa  # release/v1
        with:
          packages-dir: sdk/threewe/dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Verify install from Test PyPI
        if: ${{ !inputs.dry_run }}
        run: |
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ threewe
          python -c "from threewe import Robot; print(f'threewe installed OK, version: {Robot.__module__}')"
