# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: read

jobs:
  test-gate-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run firmware unit tests
        run: cd firmware/tests && make clean && make test

  test-gate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python SDK tests
        run: |
          cd sdk
          pip install -e ".[dev]"
          pytest tests/ -v

  test-gate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run web control type check and tests
        run: |
          cd sdk/web_control
          npm ci
          npx tsc --noEmit
          npx vitest run

  firmware-build:
    needs: [test-gate-firmware, test-gate-python, test-gate-web]
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2
    strategy:
      matrix:
        include:
          - sku: ROBOT_SKU_BASIC
            sku_suffix: basic
            production: false
          - sku: ROBOT_SKU_STANDARD
            sku_suffix: standard
            production: false
          - sku: ROBOT_SKU_PRO
            sku_suffix: pro
            production: false
          - sku: ROBOT_SKU_INDUSTRIAL
            sku_suffix: industrial
            production: false
          - sku: ROBOT_SKU_STANDARD
            sku_suffix: standard
            production: true
          - sku: ROBOT_SKU_INDUSTRIAL
            sku_suffix: industrial
            production: true
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (${{ matrix.sku_suffix }}${{ matrix.production && '-production' || '' }})
        working-directory: firmware/esp32
        env:
          SECURE_BOOT_SIGNING_KEY: ${{ matrix.production == true && secrets.SECURE_BOOT_SIGNING_KEY || '' }}
        run: |
          . $IDF_PATH/export.sh
          mkdir -p managed_components
          if [ "${{ matrix.production }}" = "true" ]; then
            if [ -z "$SECURE_BOOT_SIGNING_KEY" ]; then
              echo "::error::SECURE_BOOT_SIGNING_KEY secret is not set"
              exit 1
            fi
            echo "$SECURE_BOOT_SIGNING_KEY" | base64 -d > secure_boot_signing_key.pem
          fi
          CONFIGS="sdkconfig.defaults;sdkconfig.defaults.${{ matrix.sku_suffix }}"
          if [ "${{ matrix.production }}" = "true" ]; then
            CONFIGS="$CONFIGS;sdkconfig.defaults.production"
          fi
          idf.py -DSDKCONFIG_DEFAULTS="$CONFIGS" set-target esp32s3
          idf.py build
          rm -f secure_boot_signing_key.pem

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.sku_suffix }}${{ matrix.production && '-production' || '' }}
          path: firmware/esp32/build/robot_platform_firmware.bin
          retention-days: 30

  python-publish:
    needs: [test-gate-firmware, test-gate-python, test-gate-web]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build SDK wheel
        working-directory: sdk
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist/

  web-build:
    needs: [test-gate-firmware, test-gate-python, test-gate-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web control
        working-directory: sdk/web_control
        run: |
          npm ci
          npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-control-dist
          path: sdk/web_control/dist/
          retention-days: 30

  create-release:
    needs: [firmware-build, python-publish, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Generate checksums
        working-directory: release-artifacts
        run: |
          find . -type f -name "*.bin" -o -name "*.whl" | sort | while read f; do
            sha256sum "$f" >> CHECKSUMS.sha256
          done
          cat CHECKSUMS.sha256

      - name: Generate changelog for this release
        id: changelog
        run: |
          if command -v git-cliff &>/dev/null; then
            git cliff --latest --strip header > RELEASE_NOTES.md
          else
            # Fallback: extract from CHANGELOG.md
            VERSION="${GITHUB_REF_NAME#v}"
            sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1 > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/**/*.bin
            release-artifacts/CHECKSUMS.sha256
          fail_on_unmatched_files: false
