name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target' && github.event.action != 'closed') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7ea6ce75c0c4c1548ecf182fba158b5cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures/signatures.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA-INDIVIDUAL.md"
          branch: main
          allowlist: bot*,dependabot*,github-actions*
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, you need
            to sign the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA-INDIVIDUAL.md).

            To sign, please comment on this PR with:

            > I have read the CLA Document and I hereby sign the CLA

            If you are contributing on behalf of a company, please also review the
            [Corporate CLA](https://github.com/${{ github.repository }}/blob/main/CLA-CORPORATE.md).
          custom-allsigned-prcomment: |
            All contributors have signed the CLA. Thank you!
