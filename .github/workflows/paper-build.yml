# SPDX-License-Identifier: Apache-2.0
name: Paper Build

on:
  push:
    branches: [main]
    paths:
      - 'paper/**.tex'
      - 'paper/**.bib'
      - 'paper/figures/**'
      - 'paper/generate_*.py'
      - '.github/workflows/paper-build.yml'
  pull_request:
    paths:
      - 'paper/**.tex'
      - 'paper/**.bib'
      - 'paper/figures/**'
      - 'paper/generate_*.py'
      - '.github/workflows/paper-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile English paper (xelatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: true
          latexmk_shell_escape: false

      - name: Compile Chinese paper (xelatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_zh.tex
          working_directory: paper
          latexmk_use_xelatex: true
          latexmk_shell_escape: false
          # ctex needs the full font set; the action's default image (TeX Live full) covers it.

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: |
            paper/main.pdf
            paper/main_zh.pdf
          if-no-files-found: error

      # Note: we deliberately do NOT push the rebuilt PDFs back to main from CI.
      # Branch protection requires 2 status checks that a bot push can't satisfy,
      # so the maintainer downloads the `papers` artifact and commits it manually
      # (or via a follow-up PR). Keeping this workflow read-only also avoids
      # CI loops when other workflows ignore [skip ci].
