# SPDX-License-Identifier: Apache-2.0
name: Firmware Unit Tests

on:
  push:
    paths: ['firmware/**']
  pull_request:
    paths: ['firmware/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        working-directory: firmware/tests
        run: |
          make clean
          make test
