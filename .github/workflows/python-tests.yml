# SPDX-License-Identifier: Apache-2.0
name: Python SDK Tests

on:
  push:
    paths: ['sdk/**']
  pull_request:
    paths: ['sdk/**']

permissions:
  contents: read

jobs:
  test-threewe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install threewe with dev + sim dependencies
        run: pip install -e "sdk/threewe/[dev,sim]"

      - name: Install test extras
        run: pip install pytest-asyncio Pillow

      - name: Run tests with coverage
        working-directory: sdk/threewe
        run: pytest --cov=threewe --cov-report=xml --cov-report=term-missing tests/

      - name: Lint check
        run: |
          ruff format --check sdk/threewe/
          ruff check sdk/threewe/

  test-payload-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install SDK with dev dependencies
        run: pip install -e "sdk/[dev]"

      - name: Run tests with coverage
        working-directory: sdk
        run: pytest --cov=payload_interface --cov=tools --cov-report=xml --cov-report=term-missing tests/

      - name: Lint check
        run: |
          ruff format --check sdk/
          ruff check sdk/
