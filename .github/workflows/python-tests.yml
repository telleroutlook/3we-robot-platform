# SPDX-License-Identifier: Apache-2.0
name: Python SDK Tests

on:
  push:
    paths: ['sdk/**']
  pull_request:
    paths: ['sdk/**']

permissions:
  contents: read

jobs:
  test-threewe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install threewe with dev + sim dependencies
        run: pip install -e "sdk/threewe/[dev,sim]"

      - name: Install test extras
        run: pip install pytest-asyncio Pillow

      - name: Run tests with coverage
        working-directory: sdk/threewe
        run: pytest --cov=threewe --cov-report=xml --cov-report=term-missing tests/

      - name: Lint check
        run: |
          ruff format --check sdk/threewe/
          ruff check sdk/threewe/

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install threewe with dev + sim dependencies
        run: pip install -e "sdk/threewe/[dev,sim]"

      - name: Run benchmarks
        working-directory: sdk/threewe
        run: |
          pytest tests/test_performance.py \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-warmup=on

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: sdk/threewe/benchmark-results.json
          retention-days: 90

  test-payload-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install SDK with dev dependencies
        run: pip install -e "sdk/[dev]"

      - name: Run tests with coverage
        working-directory: sdk
        run: pytest --cov=payload_interface --cov=tools --cov-report=xml --cov-report=term-missing tests/

      - name: Lint check
        run: |
          ruff format --check sdk/
          ruff check sdk/
