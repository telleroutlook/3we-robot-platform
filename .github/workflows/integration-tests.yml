# SPDX-License-Identifier: Apache-2.0
name: Integration Tests (Simulation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ros:humble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-nav2-bringup \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-ros-gz-sim \
            ros-humble-ros-gz-bridge \
            xvfb
          pip3 install --upgrade pip
          pip3 install pytest pytest-timeout
          pip3 install ./sdk/threewe[sim]
          rosdep update
          rosdep install --from-paths ros2_ws --ignore-src -y --skip-keys="micro_ros_agent"

      - name: Cache colcon workspace
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ros2_ws/build
          key: colcon-${{ runner.os }}-${{ hashFiles('ros2_ws/*/CMakeLists.txt', 'ros2_ws/*/package.xml', 'ros2_ws/*/setup.py') }}
          restore-keys: colcon-${{ runner.os }}-

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --symlink-install

      - name: Run integration tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          ros2 launch robot_simulation gazebo.launch.py headless:=true &
          sleep 10
          pytest tests/integration/ -m "simulation and not hardware and not fullstack" --timeout=120 -v --tb=short
