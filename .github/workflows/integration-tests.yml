# SPDX-License-Identifier: Apache-2.0
name: Integration Tests (Simulation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ros:humble
    steps:
      # actions/checkout v4
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-nav2-bringup \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-ros-gz-sim \
            ros-humble-ros-gz-bridge
          pip3 install pytest pytest-timeout
          rosdep update
          rosdep install --from-paths ros2_ws --ignore-src -y --skip-keys="micro_ros_agent"

      - name: Download pre-built workspace
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: ros2-build-workspace
          path: ros2_ws
        continue-on-error: true

      - name: Cache colcon workspace
        if: steps.download-artifact.outcome == 'failure'
        uses: actions/cache@v4
        with:
          path: ros2_ws/build
          key: colcon-${{ runner.os }}-${{ hashFiles('ros2_ws/*/CMakeLists.txt', 'ros2_ws/*/package.xml', 'ros2_ws/*/setup.py') }}
          restore-keys: colcon-${{ runner.os }}-

      - name: Build workspace
        if: steps.download-artifact.outcome == 'failure'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --symlink-install

      - name: Run integration tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          ros2 launch robot_simulation gazebo.launch.py headless:=true &
          sleep 10
          pytest tests/integration/ -m "simulation and not hardware and not fullstack" --timeout=120 -v --tb=short
