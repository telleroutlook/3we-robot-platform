# Docker Compose — One-click simulation environment for threewe SDK
#
# Usage:
#   Headless (default):  docker compose -f docker-compose.sim.yml up -d
#   With browser GUI:    docker compose -f docker-compose.sim.yml --profile gui up -d
#                        Then open http://localhost:8080 in your browser.

services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    container_name: threewe-sim
    environment:
      - DISPLAY=${DISPLAY:-:99}
      - ROS_DOMAIN_ID=42
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./examples:/opt/threewe/examples:ro
    networks:
      - threewe-net
    command: >
      bash -c "
        Xvfb :99 -screen 0 1280x720x24 &
        export DISPLAY=:99 &&
        ros2 launch robot_simulation simulation.launch.py
      "
    restart: unless-stopped

  novnc:
    image: theasp/novnc:latest
    container_name: threewe-novnc
    profiles:
      - gui
    environment:
      - DISPLAY_WIDTH=1280
      - DISPLAY_HEIGHT=720
      - RUN_XTERM=no
    ports:
      - "8080:8080"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    networks:
      - threewe-net
    depends_on:
      - sim

  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    container_name: threewe-jupyter
    environment:
      - ROS_DOMAIN_ID=42
    ports:
      - "8888:8888"
    volumes:
      - ./examples:/opt/threewe/examples:rw
      - jupyter-data:/root/.jupyter
    networks:
      - threewe-net
    command: >
      bash -c "pip install --break-system-packages jupyterlab &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
               --allow-root --NotebookApp.token='' --NotebookApp.password=''"
    depends_on:
      - sim

networks:
  threewe-net:
    driver: bridge

volumes:
  jupyter-data:
