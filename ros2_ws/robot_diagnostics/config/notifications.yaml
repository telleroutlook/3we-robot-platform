# Notification channel configuration for robot platform alerts.
# All webhook URLs come from environment variables — never commit secrets.

channels:
  - name: primary
    type: webhook
    url: ${NOTIFY_WEBHOOK_URL}
    secret: ${NOTIFY_WEBHOOK_SECRET}
    format: json
    template: default
    severity_filter: [critical, warning]

  # DingTalk (钉钉) — uses actionCard format with buttons
  - name: dingtalk
    type: dingtalk
    url: ${DINGTALK_WEBHOOK_URL}
    secret: ${DINGTALK_WEBHOOK_SECRET}
    dashboard_url: ${DASHBOARD_URL}
    severity_filter: [critical, warning]

  # Feishu (飞书/Lark) — uses interactive card with colored header
  - name: feishu
    type: feishu
    url: ${FEISHU_WEBHOOK_URL}
    secret: ${FEISHU_WEBHOOK_SECRET}
    severity_filter: [critical, warning]

  # Slack — uses Block Kit with rich formatting
  - name: slack
    type: slack
    url: ${SLACK_WEBHOOK_URL}
    secret: ""
    dashboard_url: ${DASHBOARD_URL}
    severity_filter: [critical]

throttling:
  duplicate_window_seconds: 60
  quiet_hours:
    start: "22:00"
    end: "08:00"
    allowed_levels: [critical]

templates:
  default:
    title: "[{severity}] {robot_id}: {event_type}"
    body: |
      Robot: {robot_id}
      Event: {event_type}
      Severity: {severity}
      Time: {timestamp}
      Details: {details}
      Battery: {battery_percent}%
