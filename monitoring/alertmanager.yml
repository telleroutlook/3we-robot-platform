# Alertmanager configuration for robot platform.
# Webhook URLs are configured via environment variables.

global:
  resolve_timeout: 5m

route:
  group_by: ['robot_id', 'alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      repeat_interval: 30m
      continue: true
    - match:
        severity: warning
      receiver: 'default-webhook'
      repeat_interval: 2h
    - match:
        severity: info
      receiver: 'info-webhook'
      repeat_interval: 12h

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://notification-dispatcher:8090/webhook/alert'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://notification-dispatcher:8090/webhook/alert'
        send_resolved: true

  - name: 'info-webhook'
    webhook_configs:
      - url: 'http://notification-dispatcher:8090/webhook/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['robot_id']
