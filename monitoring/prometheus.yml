# Prometheus configuration for robot platform fleet monitoring.
# Deploy alongside the companion computer Docker stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/prometheus.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'robot-metrics'
    static_configs:
      - targets: ['metrics-exporter:9100']
        labels:
          robot_id: 'robot-001'

  - job_name: 'ros2-diagnostics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['metrics-exporter:9101']
        labels:
          robot_id: 'robot-001'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9102']
