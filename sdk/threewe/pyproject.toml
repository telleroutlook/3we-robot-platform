# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threewe"
version = "0.1.0a1"
description = "AI-First Python API for the 3we robot platform — Sim2Real with zero code changes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "3we Contributors" }]
keywords = ["robotics", "embodied-ai", "sim2real", "ros2", "navigation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
    "gymnasium>=0.29",
]
ai = [
    "openai>=1.0",
    "Pillow>=10.0",
]
data = [
    "h5py>=3.9",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]
all = ["threewe[sim,ai,data,dev]"]

[project.scripts]
threewe = "threewe.cli:main"

[project.urls]
Homepage = "https://github.com/3we-org/3we-robot-platform"
Documentation = "https://github.com/3we-org/3we-robot-platform/tree/main/docs"
Repository = "https://github.com/3we-org/3we-robot-platform"

[tool.hatch.build.targets.wheel]
packages = ["src/threewe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
