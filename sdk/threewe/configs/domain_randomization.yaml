# Domain Randomization Configuration for 3we Standard V2
# Calibrated from hardware measurements

physics:
  mass_scale_range: [0.9, 1.1]       # ±10% mass variation
  friction_scale_range: [0.8, 1.2]    # ±20% friction variation
  motor_torque_noise_stddev: 0.05     # 5% torque noise
  gravity_noise_stddev: 0.01          # slight gravity perturbation

visual:
  randomize_textures: true
  randomize_lighting: true
  randomize_shadows: true
  lighting_intensity_range: [0.5, 1.5]
  color_jitter: 0.1

sensor:
  lidar_noise_scale_range: [0.5, 2.0]
  imu_noise_scale_range: [0.5, 2.0]
  camera_noise_scale_range: [0.5, 2.0]
  odometry_slip_scale_range: [0.5, 2.0]

seed: null  # Set for reproducibility
