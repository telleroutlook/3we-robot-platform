<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robot Platform - Teleop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 8px 16px;
            background: #16213e;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
        }
        header h1 { font-size: 14px; font-weight: 500; }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #e74c3c;
        }
        .status-dot.connected { background: #2ecc71; }
        .connect-input {
            margin-left: auto;
            display: flex; gap: 8px; align-items: center;
        }
        .connect-input input {
            background: #0f3460;
            border: 1px solid #1a4080;
            color: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            width: 200px;
        }
        .connect-input button {
            background: #0f3460;
            color: #eee;
            border: 1px solid #1a4080;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 200px;
            grid-template-rows: 1fr auto;
            gap: 8px;
            padding: 8px;
        }
        .joystick-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #16213e;
            border-radius: 8px;
            touch-action: none;
            position: relative;
        }
        .joystick-base {
            width: 200px; height: 200px;
            border-radius: 50%;
            border: 2px solid #0f3460;
            position: relative;
        }
        .joystick-knob {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #e94560;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: none;
        }
        .info-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 12px;
        }
        .info-panel h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
        }
        .metric { display: flex; justify-content: space-between; padding: 4px 0; }
        .metric-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .estop-btn {
            grid-column: 1 / -1;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .estop-btn:active { background: #e74c3c; transform: scale(0.98); }
        .estop-btn.active { background: #27ae60; }
        .speed-control { padding: 8px 0; }
        .speed-control input { width: 100%; }
        .distance-bar {
            height: 4px;
            background: #0f3460;
            border-radius: 2px;
            margin-top: 4px;
        }
        .distance-fill {
            height: 100%;
            background: #2ecc71;
            border-radius: 2px;
            transition: width 0.2s;
        }
        .distance-fill.warn { background: #f39c12; }
        .distance-fill.danger { background: #e74c3c; }
    </style>
</head>
<body>
    <header>
        <div class="status-dot" id="statusDot"></div>
        <h1>Robot Platform Teleop</h1>
        <div class="connect-input">
            <input type="text" id="wsUrl" placeholder="ws://hostname:9090" value="ws://localhost:9090">
            <button onclick="toggleConnection()">Connect</button>
        </div>
    </header>

    <main>
        <div class="joystick-area" id="joystickArea">
            <div class="joystick-base" id="joystickBase">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
        </div>

        <div class="info-panel">
            <div>
                <h3>Battery</h3>
                <div class="metric">
                    <span>Voltage</span>
                    <span class="metric-value" id="battVoltage">--</span>
                </div>
                <div class="metric">
                    <span>Level</span>
                    <span class="metric-value" id="battLevel">--%</span>
                </div>
            </div>
            <div>
                <h3>Distance (m)</h3>
                <div class="metric"><span>Front</span><span class="metric-value" id="distFront">--</span></div>
                <div class="distance-bar"><div class="distance-fill" id="distFrontBar" style="width:100%"></div></div>
                <div class="metric"><span>Back</span><span class="metric-value" id="distBack">--</span></div>
                <div class="distance-bar"><div class="distance-fill" id="distBackBar" style="width:100%"></div></div>
                <div class="metric"><span>Left</span><span class="metric-value" id="distLeft">--</span></div>
                <div class="distance-bar"><div class="distance-fill" id="distLeftBar" style="width:100%"></div></div>
                <div class="metric"><span>Right</span><span class="metric-value" id="distRight">--</span></div>
                <div class="distance-bar"><div class="distance-fill" id="distRightBar" style="width:100%"></div></div>
            </div>
            <div class="speed-control">
                <h3>Max Speed</h3>
                <input type="range" id="speedSlider" min="10" max="100" value="50">
                <div class="metric"><span></span><span class="metric-value" id="speedValue">50%</span></div>
            </div>
        </div>

        <button class="estop-btn" id="estopBtn" onclick="toggleEstop()">EMERGENCY STOP</button>
    </main>

    <script src="main.js"></script>
</body>
</html>
