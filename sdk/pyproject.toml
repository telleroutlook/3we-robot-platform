# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robot-payload-sdk"
version = "0.1.0"
description = "PBC-34 Payload Interface SDK for the 3WE Robot Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "smbus2>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
ros = [
    "rclpy",
]

[project.scripts]
eeprom-validator = "tools.eeprom_validator:main"

[tool.hatch.build.targets.wheel]
packages = ["payload_interface", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
