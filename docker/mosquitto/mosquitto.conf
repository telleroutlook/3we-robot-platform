# Mosquitto configuration for fleet telemetry broker.
# Credentials are generated on first run via docker-entrypoint.

# Plaintext listener restricted to localhost only (for local integrations)
listener 1883 127.0.0.1
protocol mqtt

# TLS listener for network connections
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
